name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: todo_db
          POSTGRES_USER: todo_user
          POSTGRES_PASSWORD: ci-only-password
        ports:
           - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo_user -d todo_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: 'False'
      DB_NAME: todo_db
      DB_USER: todo_user
      DB_PASSWORD: ci-only-password
      DB_HOST: localhost
      DB_PORT: '5432'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.6'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Create .env for Compose
        run: |
          printf '%s\n' \
            "SECRET_KEY=ci-only-not-a-real-secret" \
            "DB_NAME=todo_db" \
            "DB_USER=todo_user" \
            "DB_PASSWORD=ci-only-password" > .env
      - name: Build and run the stack
        run: docker compose up -d --build
      - name: Wait for backend
        run: |
            curl -f --retry 30 --retry-delay 2 --retry-all-errors \
            http://localhost:8000/admin/login/
      - name: Smoke test the API
        run: |
          curl -f --fail-with-body -X POST http://localhost:8080/api/register/ \
            -H 'Content-Type: application/json' \
            -d '{"username":"smoketest","password":"smoketest123","email":"s@abc.com"}'
          curl -f --fail-with-body -X POST http://localhost:8080/api/token/ \
            -H 'Content-Type: application/json' \
            -d '{"username":"smoketest","password":"smoketest123"}'
      - name: Smoke test the frontend
        run: |
          curl -f http://localhost:8080/
          curl -f http://localhost:8080/dashboard
      - name: Show logs if something fails
        if: failure()
        run: docker compose logs
      - name: Tear down the stack
        if: always()
        run: docker compose down
  publish:
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if github.event == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: work out image names and tags
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BACKEND_IMAGE=ghcr.io/${owner}/todo-backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=ghcr.io/${owner}/todo-frontend" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - name: Log in to GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push backend
        run: |
          docker build \
          --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
          -t "$BACKEND_IMAGE:latest" -t "$BACKEND_IMAGE:$SHORT_SHA" \
          ./backend
          docker push --all-tags "$BACKEND_IMAGE"
      - name: Build and push frontend
        run: |
          docker build \
          --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
          -t "$FRONTEND_IMAGE:latest" -t "$FRONTEND_IMAGE:$SHORT_SHA" \
          ./frontend
          docker push --all-tags "$FRONTEND_IMAGE"